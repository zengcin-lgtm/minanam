<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿美族語小遊戲：媽媽的禮物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #e0f7fa 100%);
            overflow: hidden;
            touch-action: pan-y;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 答錯的搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 答對的放大彈跳動畫 */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .pop {
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 星星掉落動畫 (過關畫面) */
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .star-fall {
            position: absolute;
            animation: fall linear forwards;
        }

        /* 卡片懸浮與點擊效果 */
        .game-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .game-card:active {
            transform: scale(0.9);
        }

        .hidden-screen {
            display: none !important;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center relative">

    <!-- 1. 開始畫面 -->
    <div id="screen-start" class="flex flex-col items-center justify-center w-full h-full z-10 absolute bg-white/80 backdrop-blur-sm">
        <div class="text-8xl mb-6 pop" style="animation-iteration-count: infinite; animation-duration: 2s;">🎁</div>
        <h1 class="text-5xl md:text-6xl font-black text-pink-500 mb-4 text-center drop-shadow-md">尋找媽媽的禮物</h1>
        <p class="text-2xl md:text-3xl text-gray-600 mb-10 font-bold text-center">一起用阿美族語找找看！</p>
        <button onclick="startGame()" class="game-card bg-pink-500 text-white text-4xl font-bold py-6 px-12 rounded-full shadow-[0_8px_0_#d81b60] hover:bg-pink-400 hover:shadow-[0_6px_0_#d81b60] hover:translate-y-1 transition-all">
            開始遊戲 ❯
        </button>
    </div>

    <!-- 2. 遊戲畫面 -->
    <div id="screen-game" class="hidden-screen flex-col items-center justify-between w-11/12 max-w-4xl h-[90vh] py-6 z-0">
        
        <!-- 頂部資訊：星星收集與進度 -->
        <div class="w-full flex justify-between items-center bg-white/70 rounded-3xl p-4 shadow-sm mb-4 border-2 border-pink-100">
            <div class="flex items-center space-x-2 text-3xl">
                <span id="star-container"></span>
            </div>
            <div class="text-2xl font-bold text-gray-500 bg-gray-100 px-4 py-2 rounded-full">
                第 <span id="current-level">1</span> / <span id="total-levels">6</span> 關
            </div>
        </div>

        <!-- 題目區 -->
        <div class="flex flex-col items-center justify-center flex-1 w-full bg-white rounded-[3rem] shadow-xl border-8 border-blue-200 p-8 text-center relative overflow-hidden">
            <!-- 正確回饋圖示 (隱藏狀態) -->
            <div id="feedback-correct" class="absolute inset-0 flex items-center justify-center bg-green-100/90 backdrop-blur-sm z-20 hidden-screen">
                <div class="text-9xl pop">⭕️</div>
            </div>

            <p class="text-3xl md:text-4xl text-gray-500 font-bold mb-2">請找出：</p>
            <h2 id="question-amis" class="text-6xl md:text-7xl font-black text-blue-600 mb-4 tracking-wide">Ina</h2>
            <div class="bg-orange-100 text-orange-600 text-4xl md:text-5xl px-8 py-3 rounded-full font-bold shadow-inner border-2 border-orange-200">
                <span id="question-zh">媽媽</span>
            </div>
        </div>

        <!-- 選項區 (3個卡片) -->
        <div id="options-container" class="w-full grid grid-cols-3 gap-4 md:gap-8 mt-6">
            <!-- 卡片由 JS 動態生成 -->
        </div>

    </div>

    <!-- 3. 過關畫面 -->
    <div id="screen-end" class="hidden-screen flex-col items-center justify-center w-full h-full z-20 absolute bg-white/90 backdrop-blur-md">
        <div class="text-9xl mb-8 pop" style="animation-iteration-count: infinite; animation-duration: 1.5s;">🏆</div>
        <h1 class="text-6xl md:text-7xl font-black text-yellow-500 mb-6 text-center drop-shadow-md">太棒了！</h1>
        <p class="text-3xl md:text-4xl text-gray-700 mb-12 font-bold text-center">你學會了所有的單字！<br>可以唱歌給媽媽聽囉！</p>
        <button onclick="resetGame()" class="game-card bg-blue-500 text-white text-4xl font-bold py-6 px-12 rounded-full shadow-[0_8px_0_#1e88e5] hover:bg-blue-400 transition-all">
            再玩一次 ↺
        </button>
    </div>

    <!-- 遊戲邏輯 -->
    <script>
        // 題庫設定 (與歌曲相關的單字)
        const gameData = [
            { amis: "Ina", zh: "媽媽", correct: "👩‍👧", wrong: ["🍎", "🚗", "🐶", "🌳"] },
            { amis: "Miparadiw", zh: "唱歌", correct: "🎶", wrong: ["⚽", "🍔", "☂️", "🚲"] },
            { amis: "Midipot", zh: "照顧", correct: "🫂", wrong: ["🎈", "🎸", "🍦", "📚"] },
            { amis: "Masakero", zh: "跳舞", correct: "💃", wrong: ["🌙", "✂️", "🐟", "✏️"] },
            { amis: "Tomangic", zh: "哭泣", correct: "😭", wrong: ["☀️", "🍉", "🦋", "🌼"] },
            { amis: "Maroray", zh: "辛苦了", correct: "💦", wrong: ["🎀", "🐘", "🚗", "🧸"] }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // 畫面元素
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenEnd = document.getElementById('screen-end');
        
        const uiAmis = document.getElementById('question-amis');
        const uiZh = document.getElementById('question-zh');
        const uiOptions = document.getElementById('options-container');
        const uiCurrentLevel = document.getElementById('current-level');
        const uiTotalLevels = document.getElementById('total-levels');
        const uiStarContainer = document.getElementById('star-container');
        const uiFeedbackCorrect = document.getElementById('feedback-correct');

        // 初始化
        uiTotalLevels.textContent = gameData.length;

        function startGame() {
            screenStart.classList.add('hidden-screen');
            screenGame.classList.remove('hidden-screen');
            screenGame.classList.add('flex');
            currentQuestionIndex = 0;
            score = 0;
            updateStars();
            loadQuestion();
        }

        function loadQuestion() {
            const q = gameData[currentQuestionIndex];
            uiCurrentLevel.textContent = currentQuestionIndex + 1;
            uiAmis.textContent = q.amis;
            uiZh.textContent = q.zh;

            // 準備選項 (1個對的 + 2個隨機錯的)
            let options = [q.correct];
            let shuffledWrong = q.wrong.sort(() => 0.5 - Math.random());
            options.push(shuffledWrong[0]);
            options.push(shuffledWrong[1]);

            // 打亂選項順序
            options = options.sort(() => 0.5 - Math.random());

            // 渲染選項卡片
            uiOptions.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = "game-card bg-white border-4 border-gray-200 rounded-[2rem] h-32 md:h-48 flex items-center justify-center text-6xl md:text-8xl shadow-lg";
                btn.textContent = opt;
                
                // 點擊事件
                btn.onclick = () => checkAnswer(btn, opt === q.correct);
                uiOptions.appendChild(btn);
            });
        }

        function checkAnswer(btnElement, isCorrect) {
            if (isCorrect) {
                // 答對了
                score++;
                updateStars();
                btnElement.classList.add('border-green-400', 'bg-green-50');
                
                // 顯示大圈圈回饋
                uiFeedbackCorrect.classList.remove('hidden-screen');
                
                // 延遲後進入下一題
                setTimeout(() => {
                    uiFeedbackCorrect.classList.add('hidden-screen');
                    currentQuestionIndex++;
                    if (currentQuestionIndex < gameData.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 1200);

            } else {
                // 答錯了 (搖晃並變淡，不換題)
                btnElement.classList.add('shake', 'opacity-30', 'pointer-events-none');
                btnElement.classList.remove('border-gray-200');
                btnElement.classList.add('border-red-200', 'bg-red-50');
                
                setTimeout(() => {
                    btnElement.classList.remove('shake');
                }, 400);
            }
        }

        function updateStars() {
            uiStarContainer.innerHTML = '';
            for (let i = 0; i < score; i++) {
                uiStarContainer.innerHTML += '<span class="text-yellow-400 drop-shadow-sm pop">⭐</span>';
            }
            // 剩下的顯示空心星星
            for (let i = score; i < gameData.length; i++) {
                uiStarContainer.innerHTML += '<span class="text-gray-200">⭐</span>';
            }
        }

        function endGame() {
            screenGame.classList.add('hidden-screen');
            screenGame.classList.remove('flex');
            screenEnd.classList.remove('hidden-screen');
            screenEnd.classList.add('flex');
            createConfetti();
        }

        function resetGame() {
            screenEnd.classList.add('hidden-screen');
            screenEnd.classList.remove('flex');
            startGame();
        }

        // 過關時的星星灑落特效
        function createConfetti() {
            const emojis = ['⭐', '🌸', '💖', '🎶'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.className = 'star-fall text-3xl md:text-5xl';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    screenEnd.appendChild(confetti);
                    
                    // 動畫結束後移除元素
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
