<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太巴塱國小附設幼兒園 - 阿美族語學習網</title>
    
    <!-- ★★★ 1. 設定 Favicon (網頁標籤圖示) ★★★ -->
    <link rel="icon" type="image/jpeg" href="../images/logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="../images/logo.jpg">

    <!-- ★★★ 2. 設定 Open Graph (分享預覽圖) ★★★ -->
    <meta property="og:title" content="第8週：學校裡的白螃蟹 - 阿美族語學習網">
    <meta property="og:description" content="本週主題：尋找校園裡的白螃蟹！螃蟹在哪裡？有幾隻呢？">
    <meta property="og:image" content="../images/logo.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="article">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0f9ff;
            background-image: 
                radial-gradient(#bae6fd 2px, transparent 2px),
                radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* 下學期的海洋藍 */
        .text-theme-primary { color: #0ea5e9; } 
        .bg-theme-primary { background-color: #0ea5e9; }
        .border-theme-primary { border-color: #0ea5e9; }

        .weaving-pattern {
            height: 24px;
            width: 100%;
            background-image: 
                linear-gradient(135deg, #000000 25%, transparent 25%), 
                linear-gradient(225deg, #000000 25%, transparent 25%), 
                linear-gradient(45deg, #000000 25%, transparent 25%), 
                linear-gradient(315deg, #000000 25%, transparent 25%);
            background-position: 12px 0, 12px 0, 0 0, 0 0;
            background-size: 24px 24px;
            background-repeat: repeat-x;
            background-color: #ffffff;
            opacity: 0.9;
        }

        .vocab-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .chat-bubble {
            position: relative;
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 85%;
        }
        .chat-left {
            background-color: white;
            border: 2px solid #e5e7eb;
            border-bottom-left-radius: 2px;
            margin-right: auto;
        }
        .chat-right {
            background-color: #f0f9ff;
            border: 2px solid #bae6fd;
            border-bottom-right-radius: 2px;
            margin-left: auto;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-theme-primary rounded-full flex items-center justify-center text-white font-bold text-2xl shadow-sm overflow-hidden border-2 border-white">
                    <img src="../images/logo.jpg" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerText='T'">
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-bold text-gray-800 tracking-wide leading-tight">阿美族語學習網</span>
                    <span class="text-sm text-gray-500 font-medium">太巴塱國小附設幼兒園</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:block mr-4">
                    <a href="../index.html" class="text-gray-500 hover:text-sky-500 font-bold transition flex items-center">
                        <i class="fa-solid fa-house mr-2"></i>回首頁
                    </a>
                </div>
                <!-- 登入按鈕 -->
                <button id="header-login-btn" onclick="AuthSystem.showLoginModal()" class="flex items-center gap-2 text-theme-primary font-bold hover:bg-sky-50 px-4 py-2 rounded-full transition border-2 border-theme-primary bg-white">
                    <i class="fa-solid fa-user"></i>
                    <span class="hidden sm:inline">登入 / 註冊</span>
                </button>
                <!-- 登入後的使用者資訊 -->
                <div id="header-user-info" class="hidden items-center gap-3 bg-sky-50 py-1 px-2 rounded-full border border-sky-100 pr-4">
                    <div class="w-8 h-8 bg-theme-primary text-white rounded-full flex items-center justify-center font-bold shadow-sm">
                        <i class="fa-solid fa-face-smile"></i>
                    </div>
                    <div class="hidden sm:block">
                        <div class="text-[10px] text-gray-500 leading-none mb-1">Nga'ay ho!</div>
                        <div id="header-username" class="font-bold text-sm text-gray-800 leading-none"></div>
                    </div>
                    <button onclick="AuthSystem.logout()" class="text-gray-400 hover:text-red-500 transition ml-2" title="登出">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="weaving-pattern"></div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full space-y-10">

        <!-- 頁面標題 -->
        <div class="text-center mb-8 relative">
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 text-4xl text-sky-200 opacity-50"><i class="fa-solid fa-camera-retro"></i></div>
            <h1 id="page-title" class="text-3xl font-bold text-gray-800 mb-2 relative z-10">載入中...</h1>
            <p class="text-gray-600 font-medium">學校裡面有很多白螃蟹，我們一起來找找看吧！</p>
            <div class="h-1 w-20 bg-theme-primary mx-auto rounded-full mt-4"></div>
        </div>

        <!-- 1. 句型練習區 -->
        <section>
            <div class="flex items-center mb-6">
                <div class="w-10 h-10 bg-sky-500 rounded-full flex items-center justify-center text-white mr-3 shadow-md border-2 border-sky-200">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">情境對話：校園生態大探索</h2>
            </div>

            <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 border-2 border-sky-100 relative overflow-hidden">
                <!-- 裝飾背景 -->
                <i class="fa-solid fa-magnifying-glass absolute top-4 right-6 text-6xl text-gray-50 opacity-50"></i>
                
                <!-- 對話容器 -->
                <div id="sentences-container" class="space-y-10 relative z-10">
                    <!-- 內容自動填入 -->
                </div>
            </div>
        </section>

        <!-- 2. 單字學習區 -->
        <section>
            <div class="flex items-center mb-6 mt-12">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-white mr-3 shadow-md border-2 border-green-200">
                    <i class="fa-solid fa-book"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">白螃蟹單字</h2>
            </div>

            <!-- 單字卡片容器 -->
            <div id="vocab-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 內容自動填入 -->
            </div>
        </section>

        <!-- 3. 功能按鈕區 -->
        <section class="bg-gradient-to-r from-sky-50 to-blue-50 rounded-3xl p-8 text-center border-2 border-white shadow-inner mt-10">
            <h3 class="text-xl font-bold text-gray-800 mb-6"><i class="fa-solid fa-star text-yellow-400 mr-2"></i>學習挑戰區</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
                
                <!-- 下載學習單 -->
                <a id="worksheet-link" href="#" class="flex items-center justify-center bg-white hover:bg-gray-50 text-gray-700 border-2 border-gray-200 font-bold py-4 px-6 rounded-xl transition shadow-sm hover:shadow-md group">
                    <i class="fa-solid fa-file-arrow-down text-2xl mr-3 text-blue-500 group-hover:scale-110 transition"></i>
                    <div class="text-left">
                        <div class="text-lg">下載學習單</div>
                        <div class="text-xs text-gray-400">PDF 練習檔案</div>
                    </div>
                </a>

                <!-- 遊戲挑戰 -->
                <a id="game-link" href="#" target="_blank" class="flex items-center justify-center bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 px-6 rounded-xl transition shadow-md hover:shadow-lg hover:scale-105 transform border-2 border-sky-300">
                    <i class="fa-solid fa-gamepad text-3xl mr-3 text-yellow-100"></i>
                    <div class="text-left">
                        <div class="text-lg">遊戲挑戰</div>
                        <div class="text-xs text-sky-100">測驗看看學會了嗎？</div>
                    </div>
                </a>

            </div>
        </section>

        <!-- 底部導覽 -->
        <div class="text-center pt-8 pb-4">
            <a href="../index.html" class="inline-flex items-center text-gray-500 hover:text-sky-500 font-bold transition px-4 py-2 rounded-full hover:bg-white border border-transparent hover:border-gray-200">
                <i class="fa-solid fa-house mr-2"></i> 回網站首頁
            </a>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-gray-800 text-gray-300 py-10 mt-8">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-6 md:mb-0 text-center md:text-left">
                <h4 class="text-white font-bold text-xl mb-2">太巴塱國民小學附設幼兒園</h4>
                <p class="text-sm opacity-80"><i class="fa-solid fa-location-dot mr-2"></i>花蓮縣光復鄉中正路二段23號</p>
                <p class="text-sm opacity-80 mt-1">傳承文化，快樂學習</p>
            </div>
            <div class="border-t border-gray-700 mt-8 pt-6 text-center text-xs text-gray-500 w-full md:w-auto md:border-t-0 md:mt-0">
                &copy; 2026 Tafalong Elementary School Preschool.
            </div>
        </div>
    </footer>

    <!-- 音效播放器 -->
    <audio id="audio-player"></audio>

    <!-- 引入會員系統 -->
    <script src="../js/auth.js"></script>

    <!-- ========================================== -->
    <!--          JAVASCRIPT 設定與邏輯區           -->
    <!-- ========================================== -->
    <script>
        // =================================================================
        // ★★★ 下學期 第8週課程內容 ★★★
        // =================================================================
        
        const lessonData = {
            title: "第 8 週：學校裡的白螃蟹",
            
            // 多組句型對話
            sentences: [
                {
                    title: "1. 找找看",
                    dialogs: [
                        {
                            role: "學生",
                            icon: "fa-child",
                            roleColor: "text-sky-600 bg-sky-100 border-sky-200",
                            isRight: false,
                            text: "I cowa ko kalang?",
                            translation: "螃蟹在哪裡？",
                            audio: "../audio/s2_w8_q1.wav"
                        },
                        {
                            role: "老師",
                            icon: "fa-person-chalkboard",
                            roleColor: "text-orange-600 bg-orange-100 border-orange-200",
                            isRight: true,
                            text: "I tiraw ko kalang.",
                            translation: "螃蟹在那裡。",
                            audio: "../audio/s2_w8_a1.wav"
                        }
                    ]
                },
                {
                    title: "2. 數一數",
                    dialogs: [
                        {
                            role: "學生",
                            icon: "fa-child",
                            roleColor: "text-sky-600 bg-sky-100 border-sky-200",
                            isRight: false,
                            text: "Pina ko kalang?",
                            translation: "有幾隻螃蟹？",
                            audio: "../audio/s2_w8_q2.wav"
                        },
                        {
                            role: "老師",
                            icon: "fa-person-chalkboard",
                            roleColor: "text-orange-600 bg-orange-100 border-orange-200",
                            isRight: true,
                            text: "Sepat ko kalang.",
                            translation: "有四隻螃蟹。",
                            audio: "../audio/s2_w8_a2.wav"
                        }
                    ]
                }
            ],

            // 單字列表
            vocabList: [
                {
                    word: "kalang",
                    subText: "",
                    translation: "螃蟹",
                    image: "../images/kalang.jpg", 
                    audio: "../audio/kalang.wav", 
                    color: "red" 
                },
                {
                    word: "fohecalay",
                    subText: "",
                    translation: "白色",
                    image: "../images/fohecalay.jpg", 
                    audio: "../audio/fohecalay.wav", 
                    color: "gray"
                },
                {
                    word: "pina",
                    subText: "",
                    translation: "多少",
                    image: "../images/pina.jpg", 
                    audio: "../audio/pina.wav", 
                    color: "purple"
                }
            ],

            links: {
                worksheet: "#", 
                worksheetAlert: "學習單尚未上傳喔！",
                game: "../games/game_s2_week8.html" // 預留給第8週的遊戲
            }
        };

        // =================================================================
        // 下方程式碼負責將資料填入網頁
        // =================================================================

        function initPage() {
            document.title = "太巴塱國小附設幼兒園 - " + lessonData.title;
            document.getElementById('page-title').textContent = lessonData.title;

            // --- 渲染多組句型對話 ---
            const sentencesContainer = document.getElementById('sentences-container');
            sentencesContainer.innerHTML = ''; 

            lessonData.sentences.forEach((section, index) => {
                let sectionHtml = `
                    <div class="${index > 0 ? 'pt-8 border-t border-dashed border-sky-200' : ''}">
                        <h3 class="font-bold text-sky-600 mb-4 bg-sky-50 inline-block px-3 py-1 rounded-full text-sm border border-sky-100">${section.title}</h3>
                `;

                section.dialogs.forEach(dialog => {
                    const alignmentClass = dialog.isRight ? "flex-row-reverse" : "";
                    const marginClass = dialog.isRight ? "ml-4" : "mr-4";
                    const bubbleClass = dialog.isRight ? "chat-right" : "chat-left";
                    const textAlignment = dialog.isRight ? "text-right" : "text-left";
                    const btnPosition = dialog.isRight ? "-left-10" : "-right-10";

                    sectionHtml += `
                        <div class="flex items-end mb-4 ${alignmentClass}">
                            <div class="w-12 h-12 rounded-full flex-shrink-0 ${marginClass} overflow-hidden border-2 shadow-sm flex items-center justify-center text-xl ${dialog.roleColor}">
                                <i class="fa-solid ${dialog.icon}"></i>
                            </div>
                            <div class="chat-bubble ${bubbleClass}">
                                <div class="text-gray-400 text-xs font-bold mb-1 ${textAlignment}">${dialog.role}</div>
                                <p class="text-xl font-bold text-gray-800 ${textAlignment}">${dialog.text}</p>
                                <p class="text-gray-500 text-sm mt-1 ${textAlignment}">${dialog.translation}</p>
                                <button onclick="playAudio('${dialog.audio}')" class="absolute ${btnPosition} bottom-0 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:text-sky-500 hover:bg-sky-50 transition shadow-sm border border-gray-200">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                sectionHtml += `</div>`;
                sentencesContainer.innerHTML += sectionHtml;
            });

            // --- 渲染單字卡 ---
            const vocabContainer = document.getElementById('vocab-container');
            vocabContainer.innerHTML = ''; 

            lessonData.vocabList.forEach(item => {
                const colorMap = {
                    red:    { border: 'border-red-500',    bg: 'bg-red-50',    text: 'text-red-600',    hover: 'hover:bg-red-100',    icon: 'fa-bug' },
                    gray:   { border: 'border-gray-400',   bg: 'bg-gray-50',   text: 'text-gray-600',   hover: 'hover:bg-gray-100',   icon: 'fa-palette' },
                    purple: { border: 'border-purple-500', bg: 'bg-purple-50', text: 'text-purple-600', hover: 'hover:bg-purple-100', icon: 'fa-hashtag' }
                };
                
                const style = colorMap[item.color] || colorMap['red'];

                const cardHtml = `
                    <div class="vocab-card bg-white rounded-2xl overflow-hidden shadow-md border-b-4 ${style.border} relative">
                        <div class="absolute top-2 right-2 text-2xl opacity-20 ${style.text}"><i class="fa-solid ${style.icon}"></i></div>
                        <div class="h-48 bg-gray-100 flex items-center justify-center relative group cursor-pointer border-b border-gray-100" onclick="playAudio('${item.audio}')">
                            <img src="${item.image}" class="w-full h-full object-cover" alt="${item.translation}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2663/2663046.png'">
                            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition flex items-center justify-center">
                                <i class="fa-solid fa-volume-high text-white opacity-0 group-hover:opacity-100 text-4xl drop-shadow-md"></i>
                            </div>
                        </div>
                        <div class="p-5 text-center">
                            <h3 class="text-3xl font-bold text-gray-800 mb-1 leading-tight">${item.word}</h3>
                            ${item.subText ? `<p class="text-xs text-gray-400 mb-2">${item.subText}</p>` : '<div class="mb-2"></div>'}
                            <p class="text-gray-500 text-lg">${item.translation}</p>
                            <button onclick="playAudio('${item.audio}')" class="mt-4 w-full ${style.bg} ${style.hover} ${style.text} py-2 rounded-lg font-bold transition text-sm flex items-center justify-center">
                                <i class="fa-solid fa-play mr-2"></i> 聽發音
                            </button>
                        </div>
                    </div>
                `;
                vocabContainer.innerHTML += cardHtml;
            });

            // --- 設定連結 ---
            const worksheetBtn = document.getElementById('worksheet-link');
            worksheetBtn.href = lessonData.links.worksheet;
            if (lessonData.links.worksheet === '#' && lessonData.links.worksheetAlert) {
                worksheetBtn.onclick = (e) => {
                    e.preventDefault();
                    alert(lessonData.links.worksheetAlert);
                };
            }

            const gameBtn = document.getElementById('game-link');
            gameBtn.href = lessonData.links.game;
        }

        function playAudio(src) {
            const player = document.getElementById('audio-player');
            player.src = src;
            const playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Audio not found or blocked: " + src);
                });
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
